name: Inspect Study 11 public behavioral data schema (no EEG)
on:
  push:
    branches: ["research/study11-human-eeg-preflight"]
    paths:
      - studies/neural_vividness11/inspect_openneuro.py
      - .github/workflows/study11-public-schema.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pandas and test schema-inspector invariants
        working-directory: studies/neural_vividness11
        run: |
          python -m pip install "pandas>=2.1,<3"
          python -m unittest -v test_openneuro.py
      - name: Inspect real publicly released ratings schema only
        working-directory: studies/neural_vividness11
        run: python inspect_openneuro.py
      - name: Ensure no participant-level data enter the public repository
        working-directory: studies/neural_vividness11
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("schema_check.json")
          obj=json.loads(p.read_text())
          assert set(obj)=={"dataset","status","source_file","source_bytes","rows","columns","dtypes","ratings_stored","eeg_fetched","events_matched","preflight_only"}
          assert obj["ratings_stored"] is False and obj["eeg_fetched"] is False
          assert obj["events_matched"] is False and obj["preflight_only"] is True
          print("Schema only, no personally linked trials or scores.")
          PY
      - name: Commit verified metadata only to the draft branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studies/neural_vividness11/schema_check.json
          git commit -m "Record public behavioral file schema without human responses"
          git push origin HEAD:research/study11-human-eeg-preflight
