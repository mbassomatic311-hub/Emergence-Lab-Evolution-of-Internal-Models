name: Research experiment checks

on:
  pull_request:
    paths:
      - 'experiments/exp09/**'
      - 'experiments/exp10/**'
      - 'experiments/exp11/**'
      - '.github/workflows/research-experiment-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp10-tests-and-smoke-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install numpy
      - name: Run Exp10 unit tests
        working-directory: experiments/exp10
        run: python -m unittest -v
      - name: Run Exp10 smoke benchmark
        working-directory: experiments/exp10
        run: python engine10.py --worlds 20 --budget 36 --initial 10 --seed 20261017 --out /tmp/exp10_smoke_results.json
      - name: Run Exp11 unit tests
        working-directory: experiments/exp11
        run: python -m unittest -v
      - name: Run Exp11 held-out smoke benchmark
        working-directory: experiments/exp11
        run: python engine11.py --worlds 6 --budget 18 --initial 8 --seed 20261018 --out /tmp/exp11_smoke_results.json
      - name: Print benchmark summaries
        run: |
          python - <<'PY'
          import json
          for path in ('/tmp/exp10_smoke_results.json', '/tmp/exp11_smoke_results.json'):
              with open(path, encoding='utf-8') as f:
                  result = json.load(f)
              print(f'\\n=== {path} ===')
              print(json.dumps({'config': result['config'], 'summary': result['summary'], 'contrasts': result['contrasts']}, indent=2))
          PY
