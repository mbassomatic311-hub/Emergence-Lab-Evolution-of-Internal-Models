name: Study 11B verified public behavioral prediction controls
on:
  push:
    branches: ["research/study11b-tactile-eeg-alignment"]
    paths:
      - "studies/neural_detection11b/behavioral_models.py"
      - "studies/neural_detection11b/test_behavioral_models.py"
      - ".github/workflows/study11b-behavioral-models.yml"
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned modeling dependencies
        run: python -m pip install "numpy==2.2.6" "scikit-learn==1.6.1"
      - name: Test seven synthetic trial/history/leakage invariants
        working-directory: studies/neural_detection11b
        run: python -m unittest -v test_behavioral_models.py
      - name: Fit exploratory participant-forward REAL published behavior, no EEG
        working-directory: studies/neural_detection11b
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python behavioral_models.py
      - name: Guard output content against participant records and implausible counts
        working-directory: studies/neural_detection11b
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path("behavioral_aggregate.json").read_text())
          assert z["n_independent_participants"] == 18
          assert 7500 <= z["n_training_trials"]+z["n_heldout_trials"] <= 8662
          assert "NO EEG" in z["research_status"]
          assert all(len(p["descriptive_95pct_bootstrap"])==2 for p in z["contrasts"])
          assert not any(key in z for key in ("trial_predictions","participant_ids","per_subject"))
          print("Validated aggregate-only prospective prediction metrics")
          PY
      - name: Commit ONLY aggregate behavioral results to draft study
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studies/neural_detection11b/behavioral_aggregate.json
          if ! git diff --cached --quiet; then
            git commit -m "Record exploratory Study 11B prospective behavioral baselines (no EEG)"
            git push origin HEAD:research/study11b-tactile-eeg-alignment
          fi
