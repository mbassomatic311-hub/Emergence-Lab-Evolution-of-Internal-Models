name: Study 11B real EEG small-range signal preflight
on:
  push:
    branches: ["research/study11b-tactile-eeg-alignment"]
    paths:
      - "studies/neural_detection11b/inspect_signal.py"
      - "studies/neural_detection11b/test_inspect_signal.py"
      - "studies/neural_detection11b/actuator_alignment.py"
      - "studies/neural_detection11b/test_actuator_alignment.py"
      - ".github/workflows/study11b-real-eeg-preflight.yml"
permissions:
  contents: read
jobs:
  signal-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned binary array and MAT dependencies
        run: python -m pip install "numpy==2.2.6" "scipy==1.15.3"
      - name: Verify limited-range public signal reader with five synthetic unit tests
        working-directory: studies/neural_detection11b
        run: python -m unittest -v test_inspect_signal.py test_actuator_alignment.py
      - name: Inspect actual published EEG header and twelve small auxiliary signal ranges only
        working-directory: studies/neural_detection11b
        run: python inspect_signal.py
      - name: Test fixed-offset actuator alignment on disjoint late trials; NO raw signal saved
        working-directory: studies/neural_detection11b
        run: python actuator_alignment.py
      - name: Refuse public release of EEG signal samples
        run: |
          if find . -type f \( -name '*.set' -o -name '*.fdt' -o -name '*subject_predictions*.csv' \) | grep -q .; then
             echo 'Unexpected human signal or person-level file in repository'
             exit 1
          fi
          echo 'No raw EEG bytes were saved or published.'
